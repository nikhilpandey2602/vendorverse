<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <link rel="stylesheet" href="mobile.css">
    <title>Creator — VendorVerse</title>
    <!-- Theme Initialization to prevent flash of wrong theme -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('vendorverse_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.documentElement.classList.remove('theme-light', 'theme-dark', 'theme-blue');
            document.documentElement.classList.add('theme-' + savedTheme);
        })();
    </script>
    <meta name="description" content="Explore this creator's curated collection on VendorVerse.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="creator-profile.css">
</head>

<body id="creator-profile-page">

    <!-- Floating Navbar -->
    <nav class="cp-navbar" id="cp-navbar">
        <a href="index.html" class="cp-nav-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="19" y1="12" x2="5" y2="12" />
                <polyline points="12 19 5 12 12 5" />
            </svg>
            Store
        </a>
        <a href="cart.html" class="cp-nav-cart">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="9" cy="21" r="1" />
                <circle cx="20" cy="21" r="1" />
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
            </svg>
            Cart
        </a>
    </nav>

    <!-- Banner -->
    <div class="cp-banner">
        <div class="cp-banner-pattern"></div>
    </div>

    <div id="cp-content">
        <!-- Profile Header -->
        <div class="cp-header">
            <div class="cp-header-card">
                <img class="cp-avatar" id="cp-avatar" src="" alt="Creator">
                <div class="cp-info">
                    <h1 class="cp-name" id="cp-name">Creator</h1>
                    <p class="cp-bio" id="cp-bio">Loading…</p>
                    <div class="cp-meta-row">
                        <div class="cp-meta-item">
                            <span class="cp-meta-icon">📅</span>
                            Joined <span class="cp-meta-value" id="cp-join-date">—</span>
                        </div>
                        <div class="cp-meta-item">
                            <span class="cp-meta-icon">👥</span>
                            <span class="cp-meta-value" id="cp-followers">0</span> followers
                        </div>
                        <div class="cp-meta-item">
                            <span class="cp-rating-stars" id="cp-rating-stars">☆☆☆☆☆</span>
                            <span class="cp-meta-value" id="cp-rating-num">0</span>
                        </div>
                    </div>
                    <button class="cp-follow-btn" id="cp-follow-btn">Follow</button>
                </div>
            </div>
        </div>

        <!-- Featured Product -->
        <section class="cp-featured-section" id="cp-featured">
            <!-- Injected by creator-profile.js -->
        </section>

        <!-- Collection Grid -->
        <section class="cp-collection-section">
            <h2 class="cp-section-title">✦ Collection</h2>
            <div class="cp-grid" id="cp-grid">
                <!-- Injected by creator-profile.js -->
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <script src="theme.js"></script>
    <script src="animations.js"></script>
    <script src="creator-profile.js"></script>
    <script src="mobile.js" defer></script>
</body>

</html>

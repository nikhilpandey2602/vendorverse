<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <link rel="stylesheet" href="mobile.css">
    <title>My Wishlist — VendorVerse</title>
    <!-- Theme Initialization to prevent flash of wrong theme -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('vendorverse_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.documentElement.classList.remove('theme-light', 'theme-dark', 'theme-blue');
            document.documentElement.classList.add('theme-' + savedTheme);
        })();
    </script>
    <meta name="description" content="Your saved wishlist items on VendorVerse. View, manage and add your favorite products to cart.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="wishlist.css">
</head>
<body data-theme="dark">

    <!-- ═══ NAVBAR (cloned from index.html) ═══ -->
    <header class="header" id="header">
        <div class="header-container">
            <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu">
                <span></span><span></span><span></span>
            </button>
            <a href="index.html" class="logo">
                <div id="dynamic-logo" style="display:flex;align-items:center;">
                    <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
                        <path d="M20 4L36 20L20 36L4 20L20 4Z" fill="var(--accent-color)" stroke="#a78bfa" stroke-width="1.5"/>
                        <path d="M20 10L30 20L20 30L10 20L20 10Z" fill="var(--accent-gradient-start)"/>
                    </svg>
                    <span style="margin-left:8px;font-size:16px;font-weight:700;color:#fff;">VendorVerse</span>
                </div>
            </a>
            <div class="search-container" style="display:flex;flex:1;max-width:520px;margin:0 20px;">
                <div class="search-wrapper">
                    <select class="category-select" aria-label="Category" style="display:block;">
                        <option value="all">All</option>
                        <option value="electronics">Electronics</option>
                        <option value="fashion">Fashion</option>
                        <option value="home">Home</option>
                    </select>
                    <input type="search" class="search-input" placeholder="Search products..." aria-label="Search">
                    <button class="search-btn" aria-label="Search">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="header-actions">
                <div class="theme-switcher-container">
                    <select id="theme-switcher" class="theme-select" aria-label="Select theme">
                        <option value="light">☀️ Light</option>
                        <option value="dark">🌙 Dark</option>
                        <option value="blue">💎 Blue</option>
                    </select>
                </div>
                <a href="wishlist.html" class="header-action wishlist-action" aria-label="Wishlist">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                    <span class="wishlist-badge" id="wishlist-badge">0</span>
                </a>
                <a href="cart.html" class="header-action cart-action" aria-label="Cart">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-badge">0</span>
                </a>
                <a href="vendor-dashboard.html" class="header-action" aria-label="Dashboard">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" rx="1"/>
                        <rect x="14" y="3" width="7" height="7" rx="1"/>
                        <rect x="3" y="14" width="7" height="7" rx="1"/>
                        <rect x="14" y="14" width="7" height="7" rx="1"/>
                    </svg>
                </a>
                <div class="auth-section" id="auth-section">
                    <div class="auth-buttons" id="auth-buttons">
                        <button class="auth-btn auth-btn-login" id="login-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <span>Login</span>
                        </button>
                        <button class="auth-btn auth-btn-register">Register</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ═══ PAGE CONTENT ═══ -->
    <main class="wl-main">
        <!-- Page Header -->
        <div class="wl-header">
            <div class="wl-header-inner">
                <div class="wl-breadcrumb">
                    <a href="index.html">Home</a> <span class="wl-sep">›</span> <span>Wishlist</span>
                </div>
                <h1 class="wl-title">My Wishlist</h1>
                <div class="wl-count">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--accent-color)" stroke="none">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                    <span id="wl-item-count">0 Items Saved</span>
                </div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="wl-toolbar" id="wl-toolbar">
            <label class="wl-select-all">
                <input type="checkbox" id="wl-select-all-cb">
                <span>Select All</span>
            </label>
            <div class="wl-toolbar-right">
                <select class="wl-sort" id="wl-sort">
                    <option value="recent">Sort by: Recently Added</option>
                    <option value="price-low">Sort by: Price Low</option>
                    <option value="price-high">Sort by: Price High</option>
                    <option value="name">Sort by: Name</option>
                </select>
                <button class="wl-btn-add-all" id="wl-add-all">Add All to Cart</button>
                <button class="wl-btn-clear" id="wl-clear">Clear Wishlist</button>
            </div>
        </div>

        <!-- Product Grid -->
        <div class="wl-grid" id="wl-grid"></div>

        <!-- Empty State -->
        <div class="wl-empty" id="wl-empty" style="display:none;">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="1">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <h2>Your Wishlist is Empty</h2>
            <p>Save items you love and find them here</p>
            <a href="index.html" class="wl-start-btn">Start Shopping</a>
        </div>
    </main>

    <!-- Confirm Modal -->
    <div class="wl-modal-overlay" id="wl-modal" style="display:none;">
        <div class="wl-modal">
            <h3>Clear Wishlist?</h3>
            <p>This will remove all saved items</p>
            <div class="wl-modal-actions">
                <button class="wl-modal-cancel" id="wl-modal-cancel">Cancel</button>
                <button class="wl-modal-confirm" id="wl-modal-confirm">Clear All</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="wl-toast" id="wl-toast"></div>

    <script src="theme.js"></script>
    <script src="wishlist.js"></script>
    <script src="mobile.js" defer></script>
</body>
</html>
